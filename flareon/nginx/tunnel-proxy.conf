# Public sites arrive from cloudflared on this box; real client IP comes from CF-Connecting-IP (trusted from localhost only).
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;
# Combined format but WITHOUT query strings: Jellyfin/Vaultwarden put session tokens in URLs.
log_format tunnel_noq '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server { listen 127.0.0.1:8081 default_server; server_name _; access_log /var/log/nginx/tunnel-default.access.log tunnel_noq; return 404; }

upstream jellyfin_ha {
    server 10.0.0.65:8096 max_fails=1 fail_timeout=15s;   # CT107 squidjelly (primary, NODE1)
    server 10.0.0.170:8096 backup;                        # CT136 jellyspare (standby, NODE5 - only when BLADE is on)
}

server {
  listen 127.0.0.1:8081; server_name squidjelly.example.co.uk;
  access_log /var/log/nginx/tunnel-squidjelly.access.log tunnel_noq;
  client_max_body_size 0; proxy_buffering off;
  location / {
    proxy_pass http://jellyfin_ha;
    proxy_connect_timeout 3s; proxy_next_upstream error timeout http_502 http_503 http_504; proxy_next_upstream_tries 2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h; proxy_send_timeout 1h;
  }
}

server {
  listen 127.0.0.1:8081; server_name squidvault.example.co.uk;
  access_log /var/log/nginx/tunnel-squidvault.access.log tunnel_noq;
  client_max_body_size 525M;
  # /admin only from home (LAN clients reach this via the tunnel with the home public IP). Everyone else: 404.
  location ^~ /admin {
    if ($from_home != 1) { return 404; }
    proxy_pass http://10.0.0.35:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://10.0.0.35:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}


# ntfy push notifications (CT137 squidntfy). ntfy itself is deny-all with login; CrowdSec bouncer applies. 2026-11-05
server {
  listen 127.0.0.1:8081; server_name ntfy.example.co.uk;
  access_log /var/log/nginx/tunnel-ntfy.access.log tunnel_noq;
  client_max_body_size 1m;
  location / {
    proxy_pass http://10.0.0.205:2586;
    proxy_http_version 1.1;
    proxy_buffering off; proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s; proxy_read_timeout 5m; proxy_send_timeout 5m;
  }
}
