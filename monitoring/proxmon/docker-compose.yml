# proxmon — SELF-CONTAINED stack for Portainer's web editor (copy/paste).
#
# Unlike compose.prod.yml (which bind-mounts config files and is meant for a
# Git-based deploy), this version inlines every config file via Compose
# `configs`, so it works pasted straight into the Portainer stack editor with
# no repo checkout. Requires Docker Compose v2.23+ (any current Portainer).
#
# After pasting, add the environment variables (Advanced mode lets you paste the
# whole KEY=value block from your .env.monitoring).
name: proxmon

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    configs:
      - source: prometheus_config_v4
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    ports:
      # 9091 avoids clashing with another Prometheus on the same host.
      - "127.0.0.1:9091:9090"
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashprovider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_overview
        target: /var/lib/grafana/dashboards/proxmox-cluster-overview.json
      - source: grafana_switch
        target: /var/lib/grafana/dashboards-network/core-switch.json
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      # Published on the LAN so your existing homelab cloudflared can reach it
      # at http://<this-host-LAN-IP>:${GRAFANA_PORT}. Defaults to 4000 to avoid
      # another Grafana on 3000. If cloudflared runs on this same host,
      # tighten to "127.0.0.1:${GRAFANA_PORT:-4000}:3000".
      - "${GRAFANA_PORT:-4000}:3000"
    networks: [monitoring]

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.4.4   # check Docker Hub for newer
    restart: unless-stopped
    environment:
      PVE_USER: ${PVE_EXPORTER_USER}
      PVE_TOKEN_NAME: ${PVE_EXPORTER_TOKEN_NAME}
      PVE_TOKEN_VALUE: ${PVE_EXPORTER_TOKEN_VALUE}
      PVE_VERIFY_SSL: ${PVE_VERIFY_SSL:-false}
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: [--path.rootfs=/host]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  snmp-exporter:
    image: prom/snmp-exporter:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml   # bundled modules (if_mib, system)
      - --config.file=/etc/snmp_exporter/auth.yml   # switch_v3 credentials
    configs:
      - source: snmp_auth
        target: /etc/snmp_exporter/auth.yml
    networks: [monitoring]

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge

configs:
  prometheus_config_v4:
    content: |
      global:
        scrape_interval: 15s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
        - job_name: pve-nodes
          static_configs:
            - targets: ["10.0.0.10:9100", "10.0.0.40:9100", "10.0.0.50:9100", "10.0.0.20:9100", "10.0.0.80:9100"]
              labels:
                group: proxmox
        - job_name: pve
          metrics_path: /pve
          params:
            module: [default]
          static_configs:
            - targets: ["10.0.0.10"]
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: "pve-exporter:9221"
        - job_name: snmp-switch
          scrape_interval: 30s
          scrape_timeout: 20s
          metrics_path: /snmp
          params:
            auth: [switch_v3]
            module: [if_mib, system]
          static_configs:
            - targets: ["10.0.0.15"]
              labels:
                device: core-switch
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: "snmp-exporter:9116"

        - job_name: openwrt
          scrape_interval: 30s
          static_configs:
            - targets: ["10.0.0.1:9100"]
              labels:
          relabel_configs:
            - target_label: instance
              replacement: "router.lab.example.co.uk"

        - job_name: crowdsec
          scrape_interval: 30s
          static_configs:
            - targets: ["10.0.0.165:6060"]
          relabel_configs:
            - target_label: instance
              replacement: "flareon"

        - job_name: squidpatch
          scrape_interval: 5m
          static_configs:
            - targets: ["10.0.0.50:8780"]

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
          jsonData:
            timeInterval: 15s

  grafana_dashprovider:
    content: |
      apiVersion: 1
      providers:
        - name: Proxmox dashboards
          orgId: 1
          folder: Proxmox
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false
        - name: Network dashboards
          orgId: 1
          folder: Network
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards-network
            foldersFromFilesStructure: false

