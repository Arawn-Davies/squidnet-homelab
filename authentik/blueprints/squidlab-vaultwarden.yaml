# Authentik blueprint: Vaultwarden SSO (OIDC). Bound to akadmin only. Password login stays enabled. 2026-11-05
version: 1
metadata:
  name: squidlab-vaultwarden
  labels:
    blueprints.goauthentik.io/description: "Vaultwarden (squidvault) SSO"
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: vw-email
    identifiers:
      name: "squidlab: email (verified)"
    attrs:
      scope_name: email
      description: "Email, marked verified (admin-managed accounts)"
      expression: |
        return {"email": request.user.email, "email_verified": True}
  - model: authentik_providers_oauth2.oauth2provider
    id: vw-provider
    identifiers:
      name: Vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: vaultwarden
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        - {matching_mode: strict, url: "https://squidvault.example.co.uk/identity/connect/oidc-signin"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf vw-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  - model: authentik_core.application
    id: vw-app
    identifiers:
      slug: vaultwarden
    attrs:
      name: Vaultwarden
      provider: !KeyOf vw-provider
      meta_launch_url: https://squidvault.example.co.uk
      meta_description: Password manager (master password still required)
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf vw-app
      user: !Find [authentik_core.user, [username, akadmin]]
    attrs:
      order: 0
      enabled: true
