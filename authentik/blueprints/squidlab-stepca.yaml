# Authentik blueprint: step-ca SSH certificates (OIDC). Bound to akadmin only. 2026-11-05
version: 1
metadata:
  name: squidlab-stepca
  labels:
    blueprints.goauthentik.io/description: "step-ca SSH CA login for SQUIDNET"
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: stepca-email
    identifiers:
      name: "step-ca: email (verified)"
    attrs:
      scope_name: email
      description: "Email for step-ca (admin-managed accounts, so verified)"
      expression: |
        return {"email": request.user.email, "email_verified": True}
  - model: authentik_providers_oauth2.oauth2provider
    id: stepca-provider
    identifiers:
      name: step-ca
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: step-ca
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      redirect_uris:
        - {matching_mode: regex, url: "^http://(127\\.0\\.0\\.1|localhost):10000(/.*)?$"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf stepca-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: stepca-app
    identifiers:
      slug: step-ca
    attrs:
      name: SSH certificates (step-ca)
      provider: !KeyOf stepca-provider
      meta_description: Short-lived SSH certificates for SQUIDNET
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf stepca-app
      user: !Find [authentik_core.user, [username, akadmin]]
    attrs:
      order: 0
      enabled: true
