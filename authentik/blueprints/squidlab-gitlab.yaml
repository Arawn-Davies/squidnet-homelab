# Authentik blueprint: GitLab (git.lab.example.co.uk) SSO via OIDC. Bound to akadmin only. 2026-11-06
version: 1
metadata:
  name: squidlab-gitlab
  labels:
    blueprints.goauthentik.io/description: "GitLab (gitserver) SSO"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: gl-provider
    identifiers:
      name: GitLab
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: gitlab
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        - {matching_mode: strict, url: "https://git.lab.example.co.uk/users/auth/openid_connect/callback"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "squidlab: email (verified)"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: gl-app
    identifiers:
      slug: gitlab
    attrs:
      name: GitLab
      provider: !KeyOf gl-provider
      meta_launch_url: https://git.lab.example.co.uk
      meta_description: Git server
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gl-app
      user: !Find [authentik_core.user, [username, akadmin]]
    attrs:
      order: 0
      enabled: true
