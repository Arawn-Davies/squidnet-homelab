# Authentik blueprint: SSO apps for SQUIDLAB (never Jellyfin). Applied 2026-11-04.
version: 1
metadata:
  name: squidlab-apps
  labels:
    blueprints.goauthentik.io/description: "Grafana (metrics), PBS, Portainer OIDC + lab.example.co.uk forward-auth"
entries:
  # ---------- Grafana (proxmon, metrics.lab.example.co.uk) ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers: {name: Grafana (metrics)}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: grafana-metrics
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        - {matching_mode: strict, url: "https://metrics.lab.example.co.uk/login/generic_oauth"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: grafana-metrics}
    attrs: {name: Grafana (cluster metrics), provider: !KeyOf grafana-provider, meta_launch_url: "https://metrics.lab.example.co.uk/login/generic_oauth", policy_engine_mode: any}

  # ---------- Proxmox Backup Server ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: pbs-provider
    identifiers: {name: Proxmox Backup Server}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: pbs
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        - {matching_mode: strict, url: "https://pbs.lab.example.co.uk"}
        - {matching_mode: strict, url: "https://10.0.0.100:8007"}
        - {matching_mode: strict, url: "https://pbs-node2.lab.example.co.uk"}
        - {matching_mode: strict, url: "https://10.0.0.70:8007"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: pbs}
    attrs: {name: Proxmox Backup Server, provider: !KeyOf pbs-provider, meta_launch_url: "https://pbs.lab.example.co.uk", policy_engine_mode: any}

  # ---------- Portainer EE ----------
  - model: authentik_providers_oauth2.oauth2provider
    id: portainer-provider
    identifiers: {name: Portainer}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: portainer
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        - {matching_mode: strict, url: "https://portainer.lab.example.co.uk"}
        - {matching_mode: strict, url: "https://portainer.lab.example.co.uk/"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: portainer}
    attrs: {name: Portainer, provider: !KeyOf portainer-provider, meta_launch_url: "https://portainer.lab.example.co.uk", policy_engine_mode: any}

  # ---------- Forward auth for NPM-fronted pages on *.lab.example.co.uk (Homepage, NetAlertX, Pi-hole) ----------
  - model: authentik_providers_proxy.proxyprovider
    id: fwd-provider
    identifiers: {name: lab.example.co.uk forward auth}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_domain
      external_host: https://auth.lab.example.co.uk
      cookie_domain: lab.example.co.uk
      access_token_validity: hours=24
  - model: authentik_core.application
    identifiers: {slug: squidlab-forward-auth}
    attrs: {name: SQUIDLAB pages (forward auth), provider: !KeyOf fwd-provider, meta_launch_url: "https://lab.example.co.uk", policy_engine_mode: any}
