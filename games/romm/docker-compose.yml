# RomM game library (LAN only - never exposed to the internet). Library mounted read-only.
services:
  romm:
    image: rommapp/romm:5.4.1
    container_name: romm
    user: "1000:1000"   # library files owned by the SMB user (uid 1000 passthrough idmap on the LXC)
    restart: unless-stopped
    env_file: .env
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      - /data/gamelib:/romm/library   # read-write: RomM creates platform folders
      - ./assets:/romm/assets
      - ./config:/romm/config
    ports: ["80:8080"]
    depends_on:
      romm-db: {condition: service_healthy}
  romm-db:
    image: mariadb:11.8
    container_name: romm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: ${DB_PASSWD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
  files:
    image: nginx:1.28-alpine
    container_name: romm-files
    restart: unless-stopped
    volumes:
      - /data/gamelib:/srv/gamelib:ro
      - ./nginx/files.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8081:8081"]
volumes: {mysql_data: {}, romm_resources: {}, romm_redis_data: {}}
